<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Informativo</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/sidebar.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">

        <h2>🗺️ Mapa Informativo</h2>

<input
    type="text"
    placeholder="Buscar ubicación..."
    id="buscador">

<h3>📍 Lugares</h3>

<div id="lista-lugares"></div>

<hr>

<button>⚙ Configuración</button>

    </aside>

<main>

    <div id="map"></div>

    <aside id="panel-info">

        <h2>Información</h2>

        <p>Seleccione un lugar en el mapa o en la lista.</p>

    </aside>

</main>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="js/mapa.js"></script>
<script src="js/datos.js"></script>
<script src="js/marcadores.js"></script>

<script src="js/sidebar.js"></script>
<script src="js/buscador.js"></script>

<script src="js/app.js"></script>

<div id="visor-plano" class="oculto">

    <span id="cerrar-plano" onclick="cerrarPlano()">&times;</span>

    <img id="imagen-plano-grande" src="" alt="Plano">

</div>
</body>
</html>
